name: Build and Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.logging.stacktrace=all -Dkotest.assertions.multi-line-diff=unified
  TEST_IMAGE_TAG: ort:test

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 25
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Build all classes
      run: ./gradlew classes
  test:
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs: build
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 25
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Install mise
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      if: runner.os != 'Windows'
    - name: Run unit tests in a minimal environment
      run: mise gradle test jacocoTestReport
      if: runner.os != 'Windows'
    - name: Run unit tests
      run: ./gradlew test jacocoTestReport
      if: runner.os == 'Windows'
    - name: Create Test Summary
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
      with:
        paths: "**/test-results/**/TEST-*.xml"
      if: always()
  funTest-no-external-tools:
    needs: build
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Install mise
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
    - name: Run functional tests that do not require external tools
      env:
        VULNERABLECODE_API_KEY: ${{ secrets.VULNERABLECODE_API_KEY }}
      run: mise gradle -Dkotest.tags=!RequiresExternalTool funTest jacocoFunTestReport
    - name: Create Test Summary
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
      with:
        paths: "**/test-results/**/TEST-*.xml"
      if: always()
  funTest-external-tools:
    # Use the self-hosted runners as the standard GitHub-hosted runners for private repositories do not have enough
    # memory for these tests. The self-hosted runners use Docker-in-Docker and route all traffic through a
    # TLS-intercepting proxy.
    runs-on: self-hosted
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
    - name: Build ORT Docker Image
      run: |
        # Make the tools in the image trust the CA certificates of the runner, which include the ones of the
        # TLS-intercepting proxy. The Dockerfile imports all CRT-files from the root of the build context.
        find /usr/local/share/ca-certificates -name "*.crt" -exec cp {} . \;

        # Build the image's user with the runner's user ID so that the container can write to the workspace. Bind
        # mounts only work for the workspace, as the Docker daemon runs in a separate container that only shares the
        # work directory with the runner.
        docker build \
          --progress=plain \
          --network=host \
          --build-arg http_proxy \
          --build-arg https_proxy \
          --build-arg no_proxy \
          --build-arg USER_ID=$(id -u) \
          --target all-tools \
          --tag ${{ env.TEST_IMAGE_TAG }} \
          .
    - name: Run functional tests that do require external tools
      run: |
        # Run the functional tests in the Docker container. Configure the proxy for Gradle first, and make Python
        # tools use the system certificates, which include the ones of the TLS-intercepting proxy. Yarn 2+ ignores the
        # common proxy environment variables, so configure the proxy via its own ones. Raise the timeout from Kotest's
        # default of 10 minutes to 30 minutes, as downloads through the proxy are slower and some specs exceed the
        # default timeout.
        docker run \
          --network=host \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          -e http_proxy \
          -e https_proxy \
          -e no_proxy \
          -e YARN_HTTP_PROXY="$http_proxy" \
          -e YARN_HTTPS_PROXY="$https_proxy" \
          -e REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt \
          -e GRADLE_OPTS="$GRADLE_OPTS" \
          ${{ env.TEST_IMAGE_TAG }} \
          -c "scripts/set_gradle_proxy.sh; ./gradlew -Dkotest.tags=RequiresExternalTool \
            -Dkotest.framework.timeout=1800000 funTest jacocoFunTestReport"
    - name: Create Test Summary
      uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2
      with:
        paths: "**/test-results/**/TEST-*.xml"
      if: always()
  publication-test:
    needs: build
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
    - name: Publish to local Maven repository
      run: ./gradlew publishToMavenLocal
